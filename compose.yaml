x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    FS_DATABASE_URL: postgresql+psycopg://featurestore:featurestore@postgres:5432/featurestore
    FS_REDIS_URL: redis://redis:6379/0
    FS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    FS_MINIO_ENDPOINT: http://minio:9000
    FS_API_URL: http://api:8000
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: featurestore
      POSTGRES_PASSWORD: featurestore
      POSTGRES_DB: featurestore
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featurestore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${FS_MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        $${FS_MINIO_ACCESS_KEY:-minioadmin} $${FS_MINIO_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/$${FS_OFFLINE_BUCKET:-feature-store}
    environment:
      FS_MINIO_ACCESS_KEY: ${FS_MINIO_ACCESS_KEY:-minioadmin}
      FS_MINIO_SECRET_KEY: ${FS_MINIO_SECRET_KEY:-minioadmin}
      FS_OFFLINE_BUCKET: ${FS_OFFLINE_BUCKET:-feature-store}

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    <<: *app
    command: ["feature-store-api"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["feature-store-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  stream-consumer:
    <<: *app
    command: ["feature-store-stream"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  redpanda-data:

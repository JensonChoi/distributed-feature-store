global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: feature-store-api
    static_configs:
      - targets: [api:8000]
  - job_name: feature-store-worker
    static_configs:
      - targets: [worker:9101]
  - job_name: feature-store-stream
    static_configs:
      - targets: [stream-consumer:9102]
